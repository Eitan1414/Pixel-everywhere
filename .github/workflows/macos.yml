name: Compiler Pixel Everywhere macOS

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Restaurer les ressources graphiques
        run: |
          mkdir -p public/assets
          base64 -D < assets-encoded/pdd-logo.jpg.b64 > public/assets/pdd-logo.jpg
          base64 -D < assets-encoded/alpha-logo.png.b64 > public/assets/alpha-logo.png
          base64 -D < assets-encoded/pixel-mascot.png.b64 > public/assets/pixel-mascot.png
          base64 -D < assets-encoded/pdd2-wordmark.png.b64 > public/assets/pdd2-wordmark.png
          base64 -D < assets-encoded/pixel-body.png.b64 > public/assets/pixel-body.png
          base64 -D < assets-encoded/pixel-eye.png.b64 > public/assets/pixel-eye.png
          sips -z 512 512 public/assets/alpha-logo.png --out public/assets/alpha-logo.png

      - name: Tester le projet
        run: npm test

      - name: Construire et contrôler le bundle web macOS
        shell: bash
        run: |
          set -euo pipefail
          npm run build

          test -f www/index.html
          grep -q 'id="serverSettingsPanel"' www/index.html
          grep -q 'Serveur PDD' www/index.html
          grep -R -q 'reportRendererReady' www/assets
          grep -R -q 'reportStartupDismissed' www/assets
          grep -R -q 'safety-timeout' www/assets
          grep -R -q 'pixel-startup-overlay-release' www/assets
          grep -R -q 'pixel-startup-shell-release' www/assets
          grep -R -q 'pixel-startup-body-release' www/assets

          SETTINGS_BUNDLE="$(grep -rl --include='*.js' 'pixel-api-base-url' www/assets | head -n 1 || true)"
          test -n "$SETTINGS_BUNDLE"
          echo "Panneau Serveur PDD intégré dans : $SETTINGS_BUNDLE"

          if grep -R -q 'reprimand-overprice-quickly.ngrok-free.dev' www; then
            echo "Une ancienne adresse ngrok est encore intégrée au bundle." >&2
            exit 1
          fi

      - name: Construire les applications macOS Intel et Apple Silicon
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release
          npx electron-builder --mac dir --x64 --config.directories.output=release/x64
          npx electron-builder --mac dir --arm64 --config.directories.output=release/arm64

      - name: Lancer réellement l’application macOS
        shell: bash
        run: |
          set -euo pipefail

          if [ "$(uname -m)" = "arm64" ]; then
            APP_PATH="$(find release/arm64 -type d -name 'Pixel Everywhere.app' -print -quit)"
          else
            APP_PATH="$(find release/x64 -type d -name 'Pixel Everywhere.app' -print -quit)"
          fi
          test -n "$APP_PATH"

          EXECUTABLE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Contents/Info.plist")"
          EXECUTABLE="$APP_PATH/Contents/MacOS/$EXECUTABLE_NAME"
          LOG_FILE="$RUNNER_TEMP/pixel-macos-runtime.log"
          : > "$LOG_FILE"

          ELECTRON_ENABLE_LOGGING=1 "$EXECUTABLE" --disable-gpu --enable-logging=stderr > "$LOG_FILE" 2>&1 &
          APP_PID=$!
          READY=0

          cleanup() {
            kill "$APP_PID" 2>/dev/null || true
            wait "$APP_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          for _attempt in $(seq 1 30); do
            if grep -q 'PIXEL_RENDERER_READY' "$LOG_FILE"; then
              READY=1
              break
            fi
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              echo "L’application macOS s’est arrêtée avant d’afficher son interface." >&2
              cat "$LOG_FILE"
              exit 1
            fi
            sleep 1
          done

          cat "$LOG_FILE"
          if [ "$READY" -ne 1 ]; then
            echo "Le renderer macOS n’a jamais confirmé que l’interface était prête." >&2
            exit 1
          fi

          sleep 12
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "L’application macOS s’est arrêtée après le chargement de l’interface." >&2
            cat "$LOG_FILE"
            exit 1
          fi

      - name: Signer, vérifier et archiver les applications
        shell: bash
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          X64_APP="$(find release/x64 -type d -name 'Pixel Everywhere.app' -print -quit)"
          ARM64_APP="$(find release/arm64 -type d -name 'Pixel Everywhere.app' -print -quit)"

          test -n "$X64_APP"
          test -n "$ARM64_APP"

          verify_and_sign() {
            local app_path="$1"
            local expected_arch="$2"

            xattr -cr "$app_path"
            codesign --force --deep --sign - --timestamp=none "$app_path"
            codesign --verify --deep --strict --verbose=2 "$app_path"

            local executable_name
            executable_name="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app_path/Contents/Info.plist")"
            test -x "$app_path/Contents/MacOS/$executable_name"
            file "$app_path/Contents/MacOS/$executable_name"
            lipo -archs "$app_path/Contents/MacOS/$executable_name" | grep -qw "$expected_arch"

            test -f "$app_path/Contents/Resources/app.asar"
            codesign -dv --verbose=4 "$app_path" 2>&1 | grep -q 'Signature=adhoc'
          }

          verify_and_sign "$X64_APP" "x86_64"
          verify_and_sign "$ARM64_APP" "arm64"

          mkdir -p release/final
          X64_ZIP="release/final/Pixel-Everywhere-${VERSION}-macOS-x64-signed.zip"
          ARM64_ZIP="release/final/Pixel-Everywhere-${VERSION}-macOS-arm64-signed.zip"

          ditto -c -k --sequesterRsrc --keepParent "$X64_APP" "$X64_ZIP"
          ditto -c -k --sequesterRsrc --keepParent "$ARM64_APP" "$ARM64_ZIP"

          unzip -t "$X64_ZIP"
          unzip -t "$ARM64_ZIP"

          rm -rf release/verification
          mkdir -p release/verification/x64 release/verification/arm64
          ditto -x -k "$X64_ZIP" release/verification/x64
          ditto -x -k "$ARM64_ZIP" release/verification/arm64

          X64_CHECK="$(find release/verification/x64 -type d -name 'Pixel Everywhere.app' -print -quit)"
          ARM64_CHECK="$(find release/verification/arm64 -type d -name 'Pixel Everywhere.app' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$X64_CHECK"
          codesign --verify --deep --strict --verbose=2 "$ARM64_CHECK"

          X64_EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$X64_CHECK/Contents/Info.plist")"
          ARM64_EXEC="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$ARM64_CHECK/Contents/Info.plist")"
          test -x "$X64_CHECK/Contents/MacOS/$X64_EXEC"
          test -x "$ARM64_CHECK/Contents/MacOS/$ARM64_EXEC"

          shasum -a 256 "$X64_ZIP" "$ARM64_ZIP" > release/final/SHA256SUMS.txt

      - name: Publier les applications macOS signées et vérifiées
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Everywhere-macOS-signed-verified
          path: release/final/*
          if-no-files-found: error

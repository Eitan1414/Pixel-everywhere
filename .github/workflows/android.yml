name: Compiler Pixel Everywhere

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # Tunnel HTTPS public vers le serveur Termux.
      VITE_API_BASE_URL: https://reprimand-overprice-quickly.ngrok-free.dev/api

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Préparer la clé Alpha Android stable
        run: |
          set -euo pipefail
          mkdir -p ~/.android
          base64 --decode android-signing/pixel-alpha-update.keystore.b64 > ~/.android/pixel-alpha-update.keystore
          chmod 600 ~/.android/pixel-alpha-update.keystore
          keytool -list -v \
            -keystore ~/.android/pixel-alpha-update.keystore \
            -storepass android \
            -alias androiddebugkey | grep -q 'Pixel Everywhere Alpha Update'

      - name: Installer les dépendances
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm install --no-audit --no-fund

      - name: Installer ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Restaurer les ressources graphiques
        run: |
          mkdir -p public/assets
          base64 --decode assets-encoded/pdd-logo.jpg.b64 > public/assets/pdd-logo.jpg
          base64 --decode assets-encoded/alpha-logo.png.b64 > public/assets/alpha-logo.png
          base64 --decode assets-encoded/pixel-mascot.png.b64 > public/assets/pixel-mascot.png
          base64 --decode assets-encoded/pdd2-wordmark.png.b64 > public/assets/pdd2-wordmark.png
          base64 --decode assets-encoded/pixel-body.png.b64 > public/assets/pixel-body.png
          base64 --decode assets-encoded/pixel-eye.png.b64 > public/assets/pixel-eye.png
          convert public/assets/alpha-logo.png -resize 192x192 public/assets/icon-192.png
          convert public/assets/alpha-logo.png -resize 512x512 public/assets/icon-512.png

      - name: Construire l’interface
        run: npm run build

      - name: Publier le bundle web de contrôle
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Web-Bundle-Debug
          path: www
          if-no-files-found: error

      - name: Vérifier le bundle Serveur PDD
        run: |
          set -euo pipefail
          test -f www/index.html
          grep -q 'id="serverSettingsPanel"' www/index.html
          grep -q 'Serveur PDD' www/index.html
          ! grep -q 'web/server-settings.js' www/index.html
          ! grep -q 'web/enhancements.js' www/index.html
          grep -R -q 'pixel-api-base-url' www/assets
          grep -R -q 'pixel-update-last-check' www/assets
          grep -R -q 'Mises à jour automatiques' www/assets

      - name: Générer le projet Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Forcer la signature Alpha stable
        run: |
          set -euo pipefail
          cp ~/.android/pixel-alpha-update.keystore android/pixel-alpha-update.keystore
          python - <<'PY'
          from pathlib import Path

          gradle = Path("android/app/build.gradle")
          text = gradle.read_text()
          marker = "    buildTypes {"
          if marker not in text:
              raise SystemExit("Bloc buildTypes introuvable dans android/app/build.gradle")
          if "signingConfigs.pixelAlpha" not in text:
              signing = '''    signingConfigs {
                  pixelAlpha {
                      storeFile rootProject.file("pixel-alpha-update.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }

          '''
              text = text.replace(marker, signing + marker, 1)
              text = text.replace(
                  marker,
                  marker + '''
                  debug {
                      signingConfig signingConfigs.pixelAlpha
                  }''',
                  1,
              )
          gradle.write_text(text)
          PY
          grep -q 'signingConfig signingConfigs.pixelAlpha' android/app/build.gradle
          grep -q 'pixel-alpha-update.keystore' android/app/build.gradle

      - name: Appliquer la version Android
        run: |
          set -euo pipefail
          VERSION_NAME="$(node -p "require('./package.json').version")"
          VERSION_CODE="$(node -e "const [a,b,c]=require('./package.json').version.split('.').map(Number); console.log((a||0)*10000+(b||0)*100+(c||0))")"
          sed -i -E "s/versionCode [0-9]+/versionCode ${VERSION_CODE}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]+\"/versionName \"${VERSION_NAME}\"/" android/app/build.gradle
          grep -q "versionCode ${VERSION_CODE}" android/app/build.gradle
          grep -q "versionName \"${VERSION_NAME}\"" android/app/build.gradle

      - name: Appliquer le logo Alpha PDD
        run: bash scripts/brand-android.sh

      - name: Compiler l’APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Vérifier le contenu réel de l’APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          rm -rf apk-check
          mkdir apk-check
          unzip -q "$APK" 'assets/public/*' -d apk-check
          test -f apk-check/assets/public/index.html
          grep -q 'id="serverSettingsPanel"' apk-check/assets/public/index.html
          grep -q 'Serveur PDD' apk-check/assets/public/index.html
          ! grep -q 'web/server-settings.js' apk-check/assets/public/index.html
          grep -R -q 'pixel-api-base-url' apk-check/assets/public/assets
          grep -R -q 'pixel-update-last-check' apk-check/assets/public/assets

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$APKSIGNER"
          SIGNATURE_INFO="$("$APKSIGNER" verify --verbose --print-certs "$APK")"
          echo "$SIGNATURE_INFO"
          echo "$SIGNATURE_INFO" | grep -qi 'Pixel Everywhere Alpha Update'
          NORMALIZED_SIGNATURE="$(printf '%s' "$SIGNATURE_INFO" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          echo "$NORMALIZED_SIGNATURE" | grep -q '747484fb4d8026791be81823d7dc07995657770c5427b5ea812982ce321512ef'

      - name: Publier l’APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Everywhere-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

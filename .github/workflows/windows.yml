name: Compiler Pixel Everywhere Windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-everywhere-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  windows:
    name: Windows x64 — installateur et portable
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Confirmer la révision compilée
        shell: pwsh
        run: |
          Write-Host "Commit GitHub Actions : $env:GITHUB_SHA"
          git log -1 --oneline

          $verifier = Get-Content "scripts/verify-windows-bundle.mjs" -Raw
          if ($verifier.Contains("PixelServerSettings")) {
            throw "Ancien vérificateur détecté. Ce run ne compile pas la branche main actuelle."
          }
          if (-not $verifier.Contains("pixel-api-base-url")) {
            throw "Le vérificateur Windows actuel est absent."
          }

          $entry = Get-Content "web/app-entry.js" -Raw
          if (-not $entry.Contains('serverSettings: () => import("./server-settings-v2.js")')) {
            throw "Les imports Vite littéraux ne sont pas présents dans app-entry.js."
          }
          if (-not $entry.Contains('memberConversations: () => import("./member-conversations.js")')) {
            throw "La messagerie membres/staff n’est pas raccordée au bundle Windows."
          }

          Write-Host "Révision actuelle confirmée : imports Vite et vérificateur Windows récents."

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Restaurer et vérifier les ressources graphiques
        run: npm run desktop:restore

      - name: Tester le projet
        run: npm test

      - name: Construire l’interface complète
        run: npm run build

      - name: Vérifier les catégories, interactions et réglages serveur
        run: node scripts/verify-windows-bundle.mjs

      - name: Compiler Windows 64 bits — installateur et portable
        run: npx electron-builder --win nsis portable --x64 --publish never

      - name: Vérifier et préparer les fichiers Windows
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installerPath = "release/Pixel-Everywhere-$version-Windows-x64-Setup.exe"
          $portablePath = "release/Pixel-Everywhere-$version-Windows-x64-Portable.exe"
          $portableZip = "release/Pixel-Everywhere-$version-Windows-x64-Portable.zip"

          foreach ($path in @($installerPath, $portablePath)) {
            if (-not (Test-Path $path)) {
              Write-Error "Fichier Windows introuvable: $path"
              Get-ChildItem -Path release -Recurse -ErrorAction SilentlyContinue
              exit 1
            }

            $file = Get-Item $path
            if ($file.Length -lt 1MB) {
              Write-Error "Fichier Windows incomplet: $($file.Name) — $($file.Length) octets."
              exit 1
            }

            Write-Host "Fichier vérifié : $($file.Name) — $([math]::Round($file.Length / 1MB, 1)) Mo"
          }

          Compress-Archive -Path $portablePath -DestinationPath $portableZip -CompressionLevel Optimal -Force
          if (-not (Test-Path $portableZip)) {
            Write-Error "Archive portable introuvable: $portableZip"
            exit 1
          }

          Write-Host "Archive portable créée : $(Split-Path $portableZip -Leaf)"

      - name: Découper l’installateur pour la récupération
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = "release/Pixel-Everywhere-$version-Windows-x64-Setup.exe"
          $source = [System.IO.File]::OpenRead($expected)
          try {
            $buffer = New-Object byte[] (40MB)
            $index = 1
            while (($read = $source.Read($buffer, 0, $buffer.Length)) -gt 0) {
              $partPath = "{0}.part-{1:D3}" -f $expected, $index
              $part = [System.IO.File]::Create($partPath)
              try {
                $part.Write($buffer, 0, $read)
              } finally {
                $part.Dispose()
              }
              $index++
            }
          } finally {
            $source.Dispose()
          }

      - name: Publier le fragment 1 de l’installateur
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Everywhere-Windows-x64-INSTALLER-PART-1
          path: release/*-Windows-x64-Setup.exe.part-001
          if-no-files-found: error
          retention-days: 14

      - name: Publier le fragment 2 de l’installateur
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Everywhere-Windows-x64-INSTALLER-PART-2
          path: release/*-Windows-x64-Setup.exe.part-002
          if-no-files-found: error
          retention-days: 14

      - name: Publier le fragment 3 de l’installateur
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Everywhere-Windows-x64-INSTALLER-PART-3
          path: release/*-Windows-x64-Setup.exe.part-003
          if-no-files-found: error
          retention-days: 14

      - name: Publier l’installateur Windows complet
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Everywhere-Windows-x64-INSTALLER
          path: release/*-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publier la version Windows portable
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Everywhere-Windows-x64-PORTABLE
          path: release/*-Windows-x64-Portable.zip
          if-no-files-found: error
          retention-days: 14

name: Compiler Pixel Everywhere Windows

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pixel-everywhere-windows-${{ github.ref }}
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  windows:
    name: Windows x64 — version complète
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Confirmer la révision compilée
        shell: pwsh
        run: |
          Write-Host "Commit GitHub Actions : $env:GITHUB_SHA"
          git log -1 --oneline

          $verifier = Get-Content "scripts/verify-windows-bundle.mjs" -Raw
          if ($verifier.Contains("PixelServerSettings")) {
            throw "Ancien vérificateur détecté. Ce run ne compile pas la branche main actuelle."
          }
          if (-not $verifier.Contains("pixel-api-base-url")) {
            throw "Le vérificateur Windows actuel est absent."
          }

          $entry = Get-Content "web/app-entry.js" -Raw
          if (-not $entry.Contains('serverSettings: () => import("./server-settings-v2.js")')) {
            throw "Les imports Vite littéraux ne sont pas présents dans app-entry.js."
          }

          Write-Host "Révision actuelle confirmée : imports Vite et vérificateur Windows récents."

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Restaurer et vérifier les ressources graphiques
        run: npm run desktop:restore

      - name: Tester le projet
        run: npm test

      - name: Construire l’interface complète
        run: npm run build

      - name: Vérifier les catégories, interactions et réglages serveur
        run: node scripts/verify-windows-bundle.mjs

      - name: Compiler l’installateur Windows 64 bits
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Vérifier l’installateur Windows
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $expected = "release/Pixel-Everywhere-$version-Windows-x64-Setup.exe"

          if (-not (Test-Path $expected)) {
            Write-Error "Installateur Windows introuvable: $expected"
            Get-ChildItem -Path release -Recurse -ErrorAction SilentlyContinue
            exit 1
          }

          $installer = Get-Item $expected
          if ($installer.Length -lt 1MB) {
            Write-Error "L’installateur Windows semble incomplet: $($installer.Length) octets."
            exit 1
          }

          Write-Host "Installateur vérifié : $($installer.Name) — $([math]::Round($installer.Length / 1MB, 1)) Mo"

      - name: Publier l’installateur Windows complet
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Everywhere-0.31.8-Windows-x64-COMPLETE
          path: release/Pixel-Everywhere-0.31.8-Windows-x64-Setup.exe
          if-no-files-found: error
          retention-days: 14

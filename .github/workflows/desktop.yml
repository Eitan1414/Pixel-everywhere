name: Vérifier Pixel Everywhere Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop.yml"
      - ".github/workflows/windows.yml"
      - ".github/workflows/macos.yml"
      - "package.json"
      - "package-lock.json"
      - "electron/**"
      - "web/**"
      - "public/**"
      - "scripts/**"
      - "assets-encoded/**"
      - "index.html"
      - "vite.config.*"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/desktop.yml"
      - ".github/workflows/windows.yml"
      - ".github/workflows/macos.yml"
      - "package.json"
      - "package-lock.json"
      - "electron/**"
      - "web/**"
      - "public/**"
      - "scripts/**"
      - "assets-encoded/**"
      - "index.html"
      - "vite.config.*"

permissions:
  contents: read

concurrency:
  group: pixel-everywhere-desktop-check-${{ github.ref }}
  cancel-in-progress: true

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  verifier:
    name: Vérifier la version desktop 0.31.8
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm install --no-audit --no-fund

      - name: Restaurer et vérifier les ressources graphiques
        run: npm run desktop:restore

      - name: Lancer les tests
        run: npm test

      - name: Construire le bundle web de contrôle
        run: npm run build

      - name: Vérifier le bundle Electron complet
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "0.31.8"
          test -s www/index.html
          test -s public/assets/pixel-everywhere-logo.png
          test -s public/assets/desktop-icon.png
          grep -q 'id="startupAnimation"' www/index.html
          grep -q '"main": "electron/entry.cjs"' package.json
          grep -R -q 'pixelCategoriesRestored' www/assets
          grep -R -q 'page-suggestions' www/assets
          grep -R -q 'PixelServerSettings' www/assets
          grep -R -q 'PIXEL_OPTIONAL_MODULE_FAILED' www/assets
          if grep -R -q 'reprimand-overprice-quickly.ngrok-free.dev' www; then
            echo "Une ancienne adresse ngrok est encore intégrée au bundle desktop." >&2
            exit 1
          fi
          echo "Bundle desktop ${VERSION} complet vérifié avec succès."
